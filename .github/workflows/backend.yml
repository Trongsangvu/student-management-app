name: Backend CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: student-management-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: student-management-server/yarn.lock

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.5.2 --activate

      - name: Verify Yarn version
        run: yarn -v

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lint
        run: yarn lint